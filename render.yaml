services:
  - type: web
    name: mamrs
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
